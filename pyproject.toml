[project]
name = "yourhealth"
version = "0.1.0"
description = "Patient appointment scheduling agent with an eval-driven improvement loop"
readme = "README.md"
authors = [
    { name = "YashrajKupekar17", email = "ykupekar007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.26.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
