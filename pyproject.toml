[project]
name = "yourhealth"
version = "0.1.0"
description = "Patient appointment scheduling agent with an eval-driven improvement loop"
readme = "README.md"
authors = [
    { name = "YashrajKupekar17", email = "ykupekar007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "openai>=3.26.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["research_notes", "reports", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E731", "E501"]  # small lambdas are fine; line length is owned by `ruff format`
