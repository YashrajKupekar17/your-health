apiVersion: v1
kind: Service
metadata:
  name: {{ include "yourhealth.fullname" . }}
  labels: {{- include "yourhealth.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  # Keeps a client on one pod for in-cluster callers (port-forward / Service traffic).
  sessionAffinity: ClientIP
  selector: {{- include "yourhealth.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
