# Lightweight observability stack for a laptop cluster (~600Mi total):
# Prometheus (metrics + SLO alerts), Grafana (dashboard), Jaeger all-in-one (traces via OTLP).
# Chosen over kube-prometheus-stack, which needs ~2Gi and CRDs this one-service app doesn't use.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - prometheus.yaml
  - grafana.yaml
  - jaeger.yaml
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml, rules.yml]
  - name: grafana-dashboards
    files: [dashboards/yourhealth.json]
generatorOptions:
  disableNameSuffixHash: false   # config change -> new name -> pods restart with it
